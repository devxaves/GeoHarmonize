<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <!-- Icon Mark (Left) -->
  <g transform="translate(10, 8)">
    <rect width="74" height="74" rx="18" fill="#0F172A"/>
    <circle cx="37" cy="37" r="28" fill="none" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Bridge Arch -->
    <path
      d="M 18 48 C 18 25, 56 25, 56 48"
      fill="none"
      stroke="#F59E0B"
      stroke-width="5"
      stroke-linecap="round"
    />
    
    <!-- Survey Pin Node -->
    <circle cx="37" cy="25" r="3" fill="#FFFFFF"/>
    <circle cx="37" cy="25" r="1.2" fill="#F59E0B"/>
    
    <!-- Land Parcels -->
    <rect x="18" y="52" width="17" height="5" rx="1.5" fill="#10B981"/>
    <rect x="39" y="52" width="17" height="5" rx="1.5" fill="#059669"/>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(98, 22)">
    <!-- English Title -->
    <text x="0" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#F59E0B">Bhoomi</tspan><tspan fill="#10B981">Setu</tspan>
    </text>
    
    <!-- Hindi Subtitle Badge -->
    <text x="142" y="23" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#94A3B8">
      भूमिसेतु
    </text>

    <!-- Institutional Subtitle -->
    <text x="0" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="1.2">
      NATIONAL LAND ACQUISITION &amp; COMPLIANCE
    </text>
  </g>
</svg>
